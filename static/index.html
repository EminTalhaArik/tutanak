<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; media-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Tutanak</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="drag-bar"></div>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <rect x="1" y="1" width="30" height="30" rx="8" fill="var(--accent)"/>
          <rect x="8.5" y="7" width="15" height="18" rx="3" fill="none" stroke="#fff" stroke-width="2.2"/>
          <path d="M12 12.5h8M12 16.5h5" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
          <circle cx="22.5" cy="22.5" r="4.2" fill="#ff5a4e" stroke="var(--accent)" stroke-width="1.6"/>
        </svg>
        Tutanak
        <a class="icon-btn settings-link" href="#/ayarlar" title="Ayarlar"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></a>
      </div>
      <div id="rec"></div>
      <div id="job"></div>
      <div class="list-tools">
        <input type="search" id="q" placeholder="Başlık, not ya da dökümde ara…">
        <div class="segmented full" id="filter">
          <button data-f="all" class="on">Tümü</button>
          <button data-f="active">Arşivlenmemiş</button>
          <button data-f="archived">Arşiv</button>
        </div>
      </div>
      <div class="meeting-list" id="list"></div>
      <div class="sidebar-foot" id="foot"></div>
    </aside>
    <main class="main" id="main" tabindex="-1"></main>
  </div>
  <script src="app.js"></script>
</body>
</html>
